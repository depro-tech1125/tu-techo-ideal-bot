services:
  - type: web
    name: tu-techo-ideal-staging
    env: node
    plan: free
    branch: feature/reinicio-logica-inmobiliaria
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: OBSERVATION_MODE
        value: "true"
      - key: NODE_ENV
        value: "staging"
      - key: KOMMO_SUBDOMAIN
        value: "tutechoidealrd"
      - key: KOMMO_BOT_ID
        value: "100766"
      - key: KOMMO_FIELD_ID
        value: "2103996"
      - key: KOMMO_ACCOUNT_ID
        value: "36728143"
      - key: USE_CLAUDE
        value: "true"
      - key: CLAUDE_MODEL
        value: "nvidia/nemotron-3.5-lightning:free"
      - key: STAGING_AUTH_TOKEN
        sync: false
      - key: KOMMO_TOKEN
        sync: false
      - key: GOOGLE_SHEET_CSV_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
