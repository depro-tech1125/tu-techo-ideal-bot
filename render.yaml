services:
  - type: web
    name: tu-techo-ideal-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: KOMMO_SUBDOMAIN
        sync: false
      - key: KOMMO_TOKEN
        sync: false
      - key: KOMMO_BOT_ID
        sync: false
      - key: KOMMO_FIELD_ID
        sync: false
      - key: GOOGLE_SHEET_CSV_URL
        sync: false
      - key: USE_CLAUDE
        value: "true"
      - key: CLAUDE_MODEL
        value: "anthropic/claude-sonnet-4.5"
      - key: OPENROUTER_API_KEY
        value: "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"
      - key: ROBERT_WHATSAPP
        value: "+584223115105"
